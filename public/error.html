<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LocalDrop - Error</title>
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <div id="root" class="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100">
      <!-- Header -->
      <header class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4">
          <div class="flex items-center gap-2">
            <div class="w-10 h-10 bg-gradient-to-br from-blue-500 to-indigo-600 rounded-lg flex items-center justify-center">
              <span class="text-white font-bold text-lg">[*]</span>
            </div>
            <h1 class="text-2xl font-bold text-gray-900">LocalDrop</h1>
          </div>
        </div>
      </header>

      <!-- Main Content -->
      <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8">
        <div class="bg-white rounded-lg shadow-lg p-8 text-center">
          <div class="mb-6">
            <div class="text-6xl text-red-500 font-bold mb-4">[!]</div>
            <h2 class="text-3xl font-bold text-gray-900 mb-2">Oops! Something went wrong</h2>
            <p class="text-lg text-gray-600">We encountered an error while processing your request.</p>
          </div>

          <div class="bg-red-50 border border-red-200 rounded-lg p-4 mb-8 text-left">
            <p class="text-sm text-red-700">
              <span class="font-semibold">[ERR]</span> Internal Server Error
            </p>
            <p class="text-xs text-red-600 mt-2">
              Please try refreshing the page or contact support if the problem persists.
            </p>
          </div>

          <a
            href="/"
            class="inline-block px-6 py-3 bg-blue-500 text-white font-medium rounded-lg hover:bg-blue-600 transition-colors"
          >
            [<] Back to Home
          </a>
        </div>
      </main>
    </div>
  </body>
</html>
